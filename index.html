<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="A privacy-friendly, browser-based music streaming player featuring local playlists, liquid glass UI, and distraction-free audio."
    />
    <meta property="og:title" content="MRTune" />
    <meta
      property="og:description"
      content="A privacy-friendly, browser-based music streaming player featuring local playlists, liquid glass UI, and distraction-free audio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./assets/mrtune.png" />
    <meta name="theme-color" content="#1db954" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MRTune" />
    <meta name="application-name" content="MRTune" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/mrtune.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/mrtune.png" />
    <title>MRTune</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <script src="./vendor/d3.min.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      // Single Page Apps for GitHub Pages redirect receiver
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
  </head>
  <body>
    <!-- PWA Install Prompt -->
    <div
      class="pwa-install-banner"
      id="pwa-install-banner"
      style="display: none"
    >
      <div class="pwa-install-content">
        <img src="./assets/mrtune.png" alt="" class="pwa-install-icon" />
        <div class="pwa-install-text">
          <strong>Install MRTune</strong>
          <span>Add to home screen for the best experience</span>
        </div>
        <button class="pwa-install-btn" id="pwa-install-btn" type="button">
          Install
        </button>
        <button
          class="pwa-install-close"
          id="pwa-install-close"
          type="button"
          aria-label="Close"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <div class="app-container">
      <!-- Sidebar (Desktop) -->
      <aside class="sidebar" aria-label="Main navigation">
        <div class="sidebar-brand">
          <img src="./assets/mrtune.png" alt="MRTune" class="sidebar-logo" />
          <span class="sidebar-brand-text">MRTune</span>
        </div>

        <nav class="sidebar-nav">
          <button class="nav-link active" data-route="/" type="button">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </button>
          <button class="nav-link" data-route="/search" type="button">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
          </button>
          <button class="nav-link" data-route="/library" type="button">
            <i class="fa-solid fa-music"></i>
            <span>Your Library</span>
          </button>
          <button class="nav-link" data-route="/settings" type="button">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </button>
        </nav>

        <div class="sidebar-divider"></div>

        <div class="sidebar-playlists-header">
          <span>Playlists</span>
          <button
            class="icon-btn small"
            data-action="open-create-playlist"
            type="button"
            aria-label="Create playlist"
          >
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <div class="sidebar-playlists" id="sidebar-playlists"></div>
      </aside>

      <!-- Main Stage -->
      <main class="main-stage" id="app-main" aria-live="polite"></main>

      <!-- Desktop Player Bar -->
      <footer
        class="player-bar"
        id="player-bar"
        aria-label="Now playing"
      ></footer>

      <!-- Mobile Mini Player -->
      <div class="mini-player" id="mini-player" aria-label="Mini player"></div>

      <!-- Mobile Bottom Nav Liquid iPhone Glass Dock -->
      <div class="mobile-nav-dock" aria-label="Mobile navigation">
        <nav class="mobile-nav-island" id="mobile-nav-island">
          <div class="elastic-capsule" id="elastic-capsule" aria-hidden="true">
            <div class="capsule-glow-halo"></div>
            <div class="capsule-liquid-layer"></div>
          </div>
          <button class="mobile-nav-item active" data-route="/" type="button">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
          </button>
          <button class="mobile-nav-item" data-route="/library" type="button">
            <i class="fa-solid fa-music"></i>
            <span>Library</span>
          </button>
          <button class="mobile-nav-item" data-route="/settings" type="button">
            <i class="fa-solid fa-gear"></i>
            <span>Settings</span>
          </button>
        </nav>
        <button class="mobile-nav-search-btn" data-route="/search" type="button" aria-label="Search" title="Search">
          <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </div>
    </div>

    <!-- Panels & Modals -->
    <div class="fullscreen-player" id="fullscreen-player"></div>
    <div class="lyrics-panel" id="lyrics-panel"></div>
    <div class="artist-profile" id="artist-profile"></div>
    <div class="queue-panel" id="queue-panel"></div>
    <div id="overlay-root"></div>

    <!-- Background & Floating YouTube Audio/Video Engine -->
    <div id="yt-player-container" class="yt-player-container">
      <div class="yt-player-header">
        <span>Now Playing Video</span>
        <button
          type="button"
          class="yt-player-close"
          data-action="toggle-video"
          aria-label="Minimize video"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div id="yt-player-host"></div>
    </div>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('./sw.js')
            .catch((err) => console.warn('SW error:', err));
        });
      }
      let deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        const banner = document.getElementById('pwa-install-banner');
        if (banner) banner.style.display = 'block';
      });
      document.addEventListener('click', (e) => {
        const installBtn = e.target.closest('#pwa-install-btn');
        const closeBtn = e.target.closest('#pwa-install-close');
        const banner = document.getElementById('pwa-install-banner');
        if (installBtn && deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => {
            deferredPrompt = null;
          });
          if (banner) banner.style.display = 'none';
        }
        if (closeBtn && banner) banner.style.display = 'none';
      });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
